spring:
  application:
    name: gateway

management:
  endpoint:
    health:
      # Expose /actuator/health/liveness and /actuator/health/readiness for
      # the Kubernetes probes (services#1 acceptance criteria).
      probes:
        enabled: true
  otlp:
    tracing:
      # In-cluster Kubernetes Service DNS default (observability#1, ADR
      # 0013); overridden at deploy time by OTLP_COLLECTOR_ENDPOINT
      # (platform's concern) -- deliberately NOT named
      # OTEL_EXPORTER_OTLP_ENDPOINT, which collides with the OTel SDK's
      # own reserved env var. opentelemetry-exporter-otlp transitively
      # pulls in the SDK's autoconfigure-spi module, which reads that
      # name directly and independently of Spring's property system,
      # treating it as a base URL and appending /v1/traces a second
      # time -- silently 404ing on /v1/traces/v1/traces. Found by
      # checking the Collector's own logs when spans never showed up,
      # not assumed from documentation.
      #
      # Fire-and-forget like the Kafka producer, not fail-fast like
      # Flyway -- an unreachable Collector shouldn't block startup.
      endpoint: ${OTLP_COLLECTOR_ENDPOINT:http://otel-collector.otel.svc.cluster.local:4318/v1/traces}
  tracing:
    sampling:
      # 100%: a single-node dev cluster with low traffic has no cost
      # reason to sample down, and full sampling is what actually proves
      # a trace can be followed across gateway/api/workers.
      probability: 1.0

api:
  # In-cluster Kubernetes Service DNS default (ADR 0010); overridden at
  # deploy time by the API_SERVICE_URL env var injected via the gateway
  # Deployment manifest (owned by platform, not services).
  base-url: ${API_SERVICE_URL:http://api.api.svc.cluster.local}
