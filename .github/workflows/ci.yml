name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

  scan:
    # Trivy CVE gate (platform#6). Builds the image here (no push) so a
    # vulnerable image never merges to main in the first place, rather than
    # scanning post-merge in build-publish.yml after the commit already
    # landed (see PR description for the full option comparison).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Static list, mirrors build-publish.yml (ADR 0008). Add a service
        # here the same day it's added to build-publish.yml's matrix.
        service: [api, workers, watchlist-service, news-ingestor, market-data-ingestor]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image for scanning (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: MODULE=${{ matrix.service }}
          tags: adamastorx/${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          push: false
          load: true

      - name: Start Postgres for api/watchlist-service smoke test
        # api's DataSource/Flyway migrate at startup and fail fast if the
        # database is unreachable at all (services#4, ADR 0012) --
        # unlike the Kafka client below, which just retries in the
        # background, a resolvable-but-empty host isn't enough here.
        # watchlist-service (backlog #53) has the identical shape (Flyway +
        # JPA against its own Postgres); workers touches neither, so this
        # only runs for the two of them.
        if: matrix.service == 'api' || matrix.service == 'watchlist-service'
        run: |
          docker network create smoke-net
          docker run -d --name smoke-postgres --network smoke-net \
            -e POSTGRES_DB=${{ matrix.service == 'api' && 'api' || 'watchlist' }} \
            -e POSTGRES_USER=${{ matrix.service == 'api' && 'api' || 'watchlist' }} \
            -e POSTGRES_PASSWORD=${{ matrix.service == 'api' && 'api' || 'watchlist' }} \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec smoke-postgres pg_isready -U ${{ matrix.service == 'api' && 'api' || 'watchlist' }} && break
            sleep 1
          done

      - name: Smoke-test image boots (platform#6 base-image swap)
        # Proves the runtime base actually runs the app, not just that it
        # builds -- relevant right now because the runtime stage moved to
        # eclipse-temurin:25-jre-alpine (musl) to drop the CVE-carrying
        # `pebble` binary bundled in the Ubuntu/rockcraft-built variant.
        #
        # KAFKA_BOOTSTRAP_SERVERS=localhost:9092 (services#3, ADR 0011):
        # this runner has no Kafka broker and no cluster DNS, so the
        # default kafka.kafka.svc.cluster.local doesn't resolve at all --
        # the Kafka client's constructor fails hostname resolution
        # synchronously and crashes app startup before actuator ever
        # comes up. localhost always resolves; the client just gets
        # connection-refused in the background instead, which it retries
        # without failing the app -- good enough for "does the image
        # boot", the only thing this step checks. api/watchlist-service
        # additionally get SPRING_DATASOURCE_URL pointed at the live
        # smoke-postgres container started above, on the same Docker network.
        run: |
          set -e
          extra_args=(-e KAFKA_BOOTSTRAP_SERVERS=localhost:9092)
          if [ "${{ matrix.service }}" = "api" ]; then
            extra_args+=(--network smoke-net \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://smoke-postgres:5432/api \
              -e SPRING_DATASOURCE_USERNAME=api \
              -e SPRING_DATASOURCE_PASSWORD=api)
          elif [ "${{ matrix.service }}" = "watchlist-service" ]; then
            extra_args+=(--network smoke-net \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://smoke-postgres:5432/watchlist \
              -e SPRING_DATASOURCE_USERNAME=watchlist \
              -e SPRING_DATASOURCE_PASSWORD=watchlist)
          elif [ "${{ matrix.service }}" = "market-data-ingestor" ]; then
            # FINNHUB_API_KEY has no baked-in default (application.yml,
            # same reasoning as SPRING_DATASOURCE_PASSWORD) -- Spring fails
            # to resolve the placeholder and the app never boots without
            # *some* value. A dummy key is fine here because
            # APP_FINNHUB_AUTO_CONNECT=false (relaxed-binding env var for
            # app.finnhub.auto-connect) stops this smoke test from ever
            # trying to use it against the real Finnhub -- "does the image
            # boot" must not depend on reaching a real external vendor from
            # a CI runner (see FinnhubWebSocketClient's own javadoc on this
            # flag).
            extra_args+=(-e FINNHUB_API_KEY=smoke-test-dummy-key \
              -e APP_FINNHUB_AUTO_CONNECT=false)
          fi
          docker run -d --name smoke -p 8080:8080 "${extra_args[@]}" adamastorx/${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          up=""
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "Container exited early:"
              docker logs smoke
              exit 1
            fi
            if curl -sf http://localhost:8080/actuator/health/liveness | grep -q '"status":"UP"'; then
              up=1
              break
            fi
            sleep 1
          done
          docker logs smoke
          docker rm -f smoke
          if [ "${{ matrix.service }}" = "api" ] || [ "${{ matrix.service }}" = "watchlist-service" ]; then
            docker rm -f smoke-postgres
            docker network rm smoke-net
          fi
          if [ -z "$up" ]; then
            echo "App never reported UP within 30s"
            exit 1
          fi

      - name: Scan image for critical/high CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: adamastorx/${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          scan-type: image
          severity: CRITICAL,HIGH
          exit-code: '1'
          # No fix available == nothing actionable to do about it today, so
          # don't fail the build on those (documented choice, see PR body).
          ignore-unfixed: true

  clinvar_service:
    # ADR 0019: this project's first non-JVM component -- a parallel job
    # rather than a branch in `build`/`scan` above, since neither the
    # toolchain (Python, not Maven) nor the dependency-scan mode (Trivy's
    # filesystem/Python-dependency mode, not just an image scan) matches
    # those Java-shaped jobs closely enough to fold in. Mirrors their
    # *shape* as closely as sensible for a different toolchain: test, then
    # build+scan the image, all gating the same `ci` merge check.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinvar-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: clinvar-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # No CLINVAR_TEST_DATABASE_URL override here -- lets
        # tests/conftest.py's testcontainers fallback spin up a real
        # Postgres container itself (Docker is available on this runner),
        # the same Testcontainers-based culture the Java side's tests
        # already use, rather than special-casing CI with a services:
        # container.
        run: pytest -q

      - uses: docker/setup-buildx-action@v4

      - name: Build image for scanning (no push)
        uses: docker/build-push-action@v7
        with:
          context: clinvar-service
          tags: adamastorx/clinvar-service:pr-${{ github.event.pull_request.number }}
          push: false
          load: true

      - name: Scan image for critical/high CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: adamastorx/clinvar-service:pr-${{ github.event.pull_request.number }}
          scan-type: image
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan Python dependencies for CVEs
        # Filesystem/dependency scan mode (ADR 0019's stated consequence:
        # "a second dependency-scanning path in CI, Trivy's filesystem/
        # Python-dependency scan mode, not just the existing JVM image
        # scan") -- catches a vulnerable pinned package in
        # requirements.txt even if the image-layer scan above doesn't
        # flag it for some reason (different Trivy scanners, same tool).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: clinvar-service
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  workload_generator:
    # backlog #45: this project's third non-JVM component (after
    # clinvar-service and clinvar-viewer) -- Python, no in-image HTTP
    # server (deliberately the simplest thing that works, a script rather
    # than a service), so its shape mirrors clinvar_service's (test, then
    # build+scan the image) minus the smoke-test step, since there's no
    # health endpoint to poll (generator/healthcheck.py is an exec probe,
    # meaningless outside a real Deployment with the heartbeat file it
    # checks).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workload-generator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workload-generator/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - uses: docker/setup-buildx-action@v4

      - name: Build image for scanning (no push)
        uses: docker/build-push-action@v7
        with:
          context: workload-generator
          tags: adamastorx/workload-generator:pr-${{ github.event.pull_request.number }}
          push: false
          load: true

      - name: Scan image for critical/high CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: adamastorx/workload-generator:pr-${{ github.event.pull_request.number }}
          scan-type: image
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan Python dependencies for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: workload-generator
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  clinvar_viewer:
    # A static nginx image with no application logic of its own (plain
    # HTML/CSS/JS, IGV.js loaded from a CDN client-side) -- no test step,
    # just build+scan the image, same as the image-scan half of the two
    # jobs above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image for scanning (no push)
        uses: docker/build-push-action@v7
        with:
          context: clinvar-viewer
          tags: adamastorx/clinvar-viewer:pr-${{ github.event.pull_request.number }}
          push: false
          load: true

      - name: Scan image for critical/high CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: adamastorx/clinvar-viewer:pr-${{ github.event.pull_request.number }}
          scan-type: image
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  ci:
    needs: [build, scan, clinvar_service, workload_generator, clinvar_viewer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ] \
            || [ "${{ needs.scan.result }}" != "success" ] \
            || [ "${{ needs.clinvar_service.result }}" != "success" ] \
            || [ "${{ needs.workload_generator.result }}" != "success" ] \
            || [ "${{ needs.clinvar_viewer.result }}" != "success" ]; then
            echo "One or more jobs failed:"
            echo "  build:              ${{ needs.build.result }}"
            echo "  scan:               ${{ needs.scan.result }}"
            echo "  clinvar_service:    ${{ needs.clinvar_service.result }}"
            echo "  workload_generator: ${{ needs.workload_generator.result }}"
            echo "  clinvar_viewer:     ${{ needs.clinvar_viewer.result }}"
            exit 1
          fi
          echo "All jobs succeeded."
