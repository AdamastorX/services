name: build-publish

# Post-merge image publish (ADR 0008). Separate concern from `ci.yml`
# (ADR 0006's PR gate, which runs `mvnw verify` and, since platform#6, a
# Trivy build+scan of the same image with no push): this workflow builds
# and pushes container images and only runs after code lands on `main`, so
# it never blocks a PR and isn't part of the required `ci` check. No
# redundant scan here — the PR gate already proved this image clean before
# merge, so this job trusts that and is pure build+push.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Static list, not dynamic module detection (YAGNI/boring per ADR
        # 0008). Add a service to this list the same day its module is
        # scaffolded.
        service: [api, workers, watchlist-service, news-ingestor, market-data-ingestor, aggregator]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: MODULE=${{ matrix.service }}
          tags: ghcr.io/adamastorx/${{ matrix.service }}:${{ github.sha }}
          push: true

  publish-clinvar-service:
    # ADR 0019: this project's first non-JVM component -- a separate job
    # rather than a matrix entry above, since it has its own Dockerfile
    # (different base image/toolchain entirely, see clinvar-service/Dockerfile)
    # and its own build context, not the shared top-level Dockerfile's
    # MODULE build-arg branch the Java services use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: clinvar-service
          tags: ghcr.io/adamastorx/clinvar-service:${{ github.sha }}
          push: true

  publish-sentiment-analyzer:
    # backlog #80, ADR 0029: this project's second non-JVM component
    # (after clinvar-service, ADR 0019) -- same reasoning as
    # publish-clinvar-service above: its own Dockerfile/build context
    # (a different toolchain, Python venv build, entirely separate from
    # the shared top-level Dockerfile's MODULE build-arg branch the Java
    # services use).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: sentiment-analyzer
          tags: ghcr.io/adamastorx/sentiment-analyzer:${{ github.sha }}
          push: true

  publish-workload-generator:
    # backlog #45 -- same reasoning as publish-clinvar-service above: its
    # own Dockerfile/build context, same Python toolchain as
    # clinvar-service but no other overlap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: workload-generator
          tags: ghcr.io/adamastorx/workload-generator:${{ github.sha }}
          push: true

  publish-clinvar-viewer:
    # Same reasoning as publish-clinvar-service above -- its own
    # Dockerfile/build context (a static nginx image, no relation to
    # either the Maven or clinvar-service toolchains).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: clinvar-viewer
          tags: ghcr.io/adamastorx/clinvar-viewer:${{ github.sha }}
          push: true

  publish-visualizer:
    # backlog #82, M13, ADR 0029: same reasoning as publish-clinvar-viewer
    # above -- its own Dockerfile/build context (a static nginx image, no
    # relation to either the Maven or clinvar-service/sentiment-analyzer
    # toolchains).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: visualizer
          tags: ghcr.io/adamastorx/visualizer:${{ github.sha }}
          push: true
