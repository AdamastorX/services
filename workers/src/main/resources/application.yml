spring:
  application:
    name: workers
  datasource:
    # services#25 (ADR 0018): workers' first Postgres connection of any
    # kind, to the *same* database api already migrates (ADR 0012) -- not
    # a second, independent Postgres instance. Same in-cluster Service DNS
    # default as api/application.yml, overridden the same way at deploy
    # time by SPRING_DATASOURCE_URL.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql.api.svc.cluster.local:5432/api}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      # Never let Hibernate create/alter schema from this module -- api's
      # Flyway history (V2__create_clinvar_tables.sql) is the single owner
      # of clinvar_release/clinvar_variant_index (see that migration's
      # header comment and workers/README.md's ClinVar section). This
      # module only reads/writes rows in already-migrated tables. A
      # practical consequence stated plainly rather than left implicit:
      # workers assumes api has already run its Flyway migration by the
      # time an ingestion actually executes -- true in steady state (the
      # scheduled trigger is weekly) and true for the manual endpoint in
      # any environment where api has ever started once, but there is no
      # explicit startup-order enforcement between the two Deployments.
      # Ingestion fails loudly (logged + clinvar.ingestion.failures
      # counter) rather than silently if the tables don't exist yet.
      ddl-auto: none
  kafka:
    # In-cluster Kubernetes Service DNS default (mirrors ADR 0010's
    # api.api.svc.cluster.local pattern); overridden at deploy time by the
    # KAFKA_BOOTSTRAP_SERVERS env var (platform's concern, ADR 0011's
    # broker deployment shape).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.kafka.svc.cluster.local:9092}
    consumer:
      # Consumer group id == spring.application.name (ADR 0011), pinned
      # here in one place rather than repeated on @KafkaListener.
      group-id: ${spring.application.name}
      # Manual immediate ack (set explicitly on the container factory in
      # WorkItemConsumerConfig -- spring.kafka.listener.ack-mode alone
      # wasn't reliably propagated in this Boot 4.1 line) commits the
      # offset only after a record is fully processed -- auto-commit's
      # time-based commit could advance the offset before processing
      # finishes, turning a crash into a lost message (at-most-once). This
      # keeps delivery at-least-once.
      enable-auto-commit: false
      # A brand-new consumer group (or one whose committed offsets have
      # expired) starts from the beginning of the topic rather than
      # skipping straight to new records -- matches the at-least-once
      # intent (ADR 0011): don't silently skip data a fresh replica
      # hasn't seen yet.
      auto-offset-reset: earliest
      # Key/value deserializers and the JSON trusted-package/target-type
      # wiring are set explicitly in WorkItemConsumerConfig (typed
      # ConsumerFactory<String, WorkItem>) rather than here, for the same
      # reason api's producer gets a typed KafkaTemplate bean instead of
      # relying on Boot's untyped Object,Object default.
    producer:
      # Used only by KafkaErrorHandlingConfig's DeadLetterPublishingRecoverer
      # to publish failed records to work-items.DLT -- workers has no other
      # producer use.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        # health (default) + prometheus: Boot's actuator does NOT expose
        # /actuator/prometheus by itself even with micrometer-registry-
        # prometheus on the classpath (observability#2, ADR 0014) --
        # found deploying this for real, Prometheus's scrape returned a
        # 404 until this was added explicitly.
        include: health,prometheus
  endpoint:
    health:
      # Expose /actuator/health/liveness and /actuator/health/readiness for
      # the Kubernetes probes, exactly like gateway/api (ADR 0011) -- the
      # embedded servlet container exists only to host this HTTP surface,
      # workers gets no Kubernetes Service (ADR 0009).
      probes:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          # In-cluster Kubernetes Service DNS default (observability#1,
          # ADR 0013); overridden at deploy time by
          # OTLP_COLLECTOR_ENDPOINT (platform's concern) -- deliberately
          # NOT named OTEL_EXPORTER_OTLP_ENDPOINT, which collides with
          # the OTel SDK's own reserved env var. opentelemetry-exporter-
          # otlp transitively pulls in the SDK's autoconfigure-spi
          # module, which reads that name directly and independently of
          # Spring's property system, treating it as a base URL and
          # appending /v1/traces a second time -- silently 404ing on
          # /v1/traces/v1/traces. Found by checking the Collector's own
          # logs when spans never showed up, not assumed from
          # documentation.
          #
          # Property path is management.opentelemetry.tracing.export.otlp.*,
          # not the older management.otlp.tracing.* -- that one is
          # deprecated (error level) since Boot 4.0 and doesn't actually
          # wire up an exporter; binding to it silently does nothing,
          # also found by checking Boot's own configuration metadata
          # after spans still didn't show up with the "obvious" property
          # name.
          #
          # Fire-and-forget like the Kafka producer, not fail-fast like
          # Flyway -- an unreachable Collector shouldn't block startup.
          endpoint: ${OTLP_COLLECTOR_ENDPOINT:http://otel-collector.otel.svc.cluster.local:4318/v1/traces}
  tracing:
    sampling:
      # 100%: a single-node dev cluster with low traffic has no cost
      # reason to sample down, and full sampling is what actually proves
      # a trace can be followed across gateway/api/workers.
      probability: 1.0

app:
  kafka:
    work-items-topic: work-items
    # services#25/#26 (ADR 0018): published once a ClinVar ingestion is
    # fully committed (Postgres row committed, filesystem `current`
    # pointer flipped) -- api's cache-invalidation consumer (services#26)
    # is this topic's only consumer today. Dot-separated, matching the
    # event-name convention the issue itself uses, deliberately different
    # from work-items' hyphenated topic-name style -- no significance
    # beyond naming taste, Kafka treats both identically.
    clinvar-ingestion-topic: clinvar.ingestion.completed
  clinvar:
    # Shared RWX PVC mount point (platform#35, ADR 0018) -- both api and
    # workers mount the same volume here. Overridden at deploy time by
    # CLINVAR_REFDATA_PATH once platform#35 lands; the default matches the
    # ADR's stated path so local/CI runs against a plain directory need no
    # override besides pointing this somewhere writable.
    refdata-path: ${CLINVAR_REFDATA_PATH:/data/refdata/clinvar}
    source-vcf-url: ${CLINVAR_SOURCE_VCF_URL:https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz}
    source-tbi-url: ${CLINVAR_SOURCE_TBI_URL:https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz.tbi}
    # Weekly, Monday 03:00 server time -- ClinVar itself publishes weekly
    # (ADR 0018); an off-peak hour, not tied to any specific observed
    # NCBI publish time. Cron, not fixedDelay -- a wall-clock schedule
    # survives a workers restart without drifting, unlike fixedDelay's
    # "N hours after the process last started" semantics.
    ingestion-cron: ${CLINVAR_INGESTION_CRON:0 0 3 * * MON}
