spring:
  application:
    name: api
  datasource:
    # In-cluster Kubernetes Service DNS default. Same namespace as this
    # app (postgresql.api.svc.cluster.local), not its own -- Postgres
    # has exactly one consumer here, unlike Kafka's two, and its Secret
    # can't be read via secretKeyRef across namespaces (ADR 0012).
    # Overridden at deploy time by SPRING_DATASOURCE_URL (platform's
    # concern). Username and password get no baked-in default -- unlike
    # a Service DNS name, a real password has no sane public one.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql.api.svc.cluster.local:5432/api}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    # Explicit, even though Boot's autoconfiguration would default to the
    # same thing -- ADR 0012's "versioned and repeatable" AC is Flyway's
    # V1__, V2__... file naming under this path, not a separate mechanism.
    locations: classpath:db/migration
  kafka:
    # In-cluster Kubernetes Service DNS default (mirrors ADR 0010's
    # api.api.svc.cluster.local pattern); overridden at deploy time by the
    # KAFKA_BOOTSTRAP_SERVERS env var (platform's concern, ADR 0011's
    # broker deployment shape).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.kafka.svc.cluster.local:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Don't stamp the JSON payload with api's WorkItem class name
        # (spring-kafka's default). Producer and consumer are different
        # modules with their own WorkItem copy (see workers/README.md) —
        # they agree on the JSON shape, not a shared Java type.
        spring.json.add.type.headers: false

management:
  endpoint:
    health:
      # Expose /actuator/health/liveness and /actuator/health/readiness for
      # the Kubernetes probes (same as gateway, services#1).
      probes:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          # In-cluster Kubernetes Service DNS default (observability#1,
          # ADR 0013); overridden at deploy time by
          # OTLP_COLLECTOR_ENDPOINT (platform's concern) -- deliberately
          # NOT named OTEL_EXPORTER_OTLP_ENDPOINT, which collides with
          # the OTel SDK's own reserved env var. opentelemetry-exporter-
          # otlp transitively pulls in the SDK's autoconfigure-spi
          # module, which reads that name directly and independently of
          # Spring's property system, treating it as a base URL and
          # appending /v1/traces a second time -- silently 404ing on
          # /v1/traces/v1/traces. Found by checking the Collector's own
          # logs when spans never showed up, not assumed from
          # documentation.
          #
          # Property path is management.opentelemetry.tracing.export.otlp.*,
          # not the older management.otlp.tracing.* -- that one is
          # deprecated (error level) since Boot 4.0 and doesn't actually
          # wire up an exporter; binding to it silently does nothing,
          # also found by checking Boot's own configuration metadata
          # after spans still didn't show up with the "obvious" property
          # name.
          #
          # Fire-and-forget like the Kafka producer, not fail-fast like
          # Flyway -- an unreachable Collector shouldn't block startup.
          endpoint: ${OTLP_COLLECTOR_ENDPOINT:http://otel-collector.otel.svc.cluster.local:4318/v1/traces}
  tracing:
    sampling:
      # 100%: a single-node dev cluster with low traffic has no cost
      # reason to sample down, and full sampling is what actually proves
      # a trace can be followed across gateway/api/workers.
      probability: 1.0

app:
  kafka:
    # 3 partitions / RF 1 is a broker-side topic-creation concern (ADR
    # 0011), not something this producer enforces — see
    # workers/README.md for the topic's actual configuration.
    work-items-topic: work-items
