spring:
  application:
    name: api
  datasource:
    # In-cluster Kubernetes Service DNS default. Same namespace as this
    # app (postgresql.api.svc.cluster.local), not its own -- Postgres
    # has exactly one consumer here, unlike Kafka's two, and its Secret
    # can't be read via secretKeyRef across namespaces (ADR 0012).
    # Overridden at deploy time by SPRING_DATASOURCE_URL (platform's
    # concern). Username and password get no baked-in default -- unlike
    # a Service DNS name, a real password has no sane public one.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql.api.svc.cluster.local:5432/api}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    # Explicit, even though Boot's autoconfiguration would default to the
    # same thing -- ADR 0012's "versioned and repeatable" AC is Flyway's
    # V1__, V2__... file naming under this path, not a separate mechanism.
    locations: classpath:db/migration
  kafka:
    # In-cluster Kubernetes Service DNS default (mirrors ADR 0010's
    # api.api.svc.cluster.local pattern); overridden at deploy time by the
    # KAFKA_BOOTSTRAP_SERVERS env var (platform's concern, ADR 0011's
    # broker deployment shape).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.kafka.svc.cluster.local:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Don't stamp the JSON payload with api's WorkItem class name
        # (spring-kafka's default). Producer and consumer are different
        # modules with their own WorkItem copy (see workers/README.md) —
        # they agree on the JSON shape, not a shared Java type.
        spring.json.add.type.headers: false
    consumer:
      # services#26 (ADR 0018): api's first Kafka *consumer* -- until now
      # it has only ever produced (work-items). Same group-id convention
      # as workers' own consumer (ADR 0011): spring.application.name.
      group-id: ${spring.application.name}
      enable-auto-commit: false
      auto-offset-reset: earliest
  data:
    redis:
      # In-cluster Kubernetes Service DNS default (services#5, ADR 0016) —
      # same pattern as Postgres/Kafka above. redis-master, not just redis
      # — the chart's standalone-architecture master Service name
      # (confirmed by rendering the chart locally, not assumed), overridden
      # at deploy time by REDIS_HOST. Password gets no baked-in default —
      # same reasoning as SPRING_DATASOURCE_PASSWORD above, a real
      # credential has no sane public one — sourced at deploy time from the
      # chart-generated Secret via REDIS_PASSWORD.
      host: ${REDIS_HOST:redis-master.api.svc.cluster.local}
      password: ${REDIS_PASSWORD:}
      # Short, deliberately: this is what makes "fail open on a Redis
      # outage" (services#5 AC) actually fail *fast* open rather than hang
      # the request for Lettuce's much longer defaults before falling
      # through to PostgreSQL. connect-timeout covers the initial TCP
      # handshake; timeout covers each command once connected.
      connect-timeout: 500ms
      timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        # health (default) + prometheus: Boot's actuator does NOT expose
        # /actuator/prometheus by itself even with micrometer-registry-
        # prometheus on the classpath (observability#2, ADR 0014) --
        # found deploying this for real, Prometheus's scrape returned a
        # 404 until this was added explicitly.
        include: health,prometheus
  endpoint:
    health:
      # Expose /actuator/health/liveness and /actuator/health/readiness for
      # the Kubernetes probes (services#1).
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        # ADR 0017's named, deliberately-deferred gap, closed here
        # (observability#15, ADR 0020) -- same reasoning as workers'
        # application.yml: without this, http.server.requests only ever
        # exposes _sum/_count/_max on /actuator/prometheus, no _bucket
        # series, no real histogram_quantile(0.95, ...). Boot's own
        # auto-configured HTTP server instrumentation, so a plain
        # property reaches it -- verified against a real running
        # instance's /actuator/prometheus output, not assumed.
        http.server.requests: true
  opentelemetry:
    tracing:
      export:
        otlp:
          # In-cluster Kubernetes Service DNS default (observability#1,
          # ADR 0013); overridden at deploy time by
          # OTLP_COLLECTOR_ENDPOINT (platform's concern) -- deliberately
          # NOT named OTEL_EXPORTER_OTLP_ENDPOINT, which collides with
          # the OTel SDK's own reserved env var. opentelemetry-exporter-
          # otlp transitively pulls in the SDK's autoconfigure-spi
          # module, which reads that name directly and independently of
          # Spring's property system, treating it as a base URL and
          # appending /v1/traces a second time -- silently 404ing on
          # /v1/traces/v1/traces. Found by checking the Collector's own
          # logs when spans never showed up, not assumed from
          # documentation.
          #
          # Property path is management.opentelemetry.tracing.export.otlp.*,
          # not the older management.otlp.tracing.* -- that one is
          # deprecated (error level) since Boot 4.0 and doesn't actually
          # wire up an exporter; binding to it silently does nothing,
          # also found by checking Boot's own configuration metadata
          # after spans still didn't show up with the "obvious" property
          # name.
          #
          # Fire-and-forget like the Kafka producer, not fail-fast like
          # Flyway -- an unreachable Collector shouldn't block startup.
          endpoint: ${OTLP_COLLECTOR_ENDPOINT:http://otel-collector.otel.svc.cluster.local:4318/v1/traces}
  tracing:
    sampling:
      # 100%: a single-node dev cluster with low traffic has no cost
      # reason to sample down, and full sampling is what actually proves
      # a trace can be followed across api/workers.
      probability: 1.0

app:
  kafka:
    # 3 partitions / RF 1 is a broker-side topic-creation concern (ADR
    # 0011), not something this producer enforces — see
    # workers/README.md for the topic's actual configuration.
    work-items-topic: work-items
    # services#25/#26 (ADR 0018); producer moved from workers to
    # clinvar-service under ADR 0019 -- api remains this topic's consumer
    # (see ClinVarCacheInvalidationConsumerConfig), the topic name and
    # api's role in it are otherwise unchanged.
    clinvar-ingestion-topic: clinvar.ingestion.completed
  cache:
    work-items:
      # 5 minutes (services#5, ADR 0016). Not a correctness mechanism —
      # work_items are immutable once created, so a cached value can never
      # diverge from PostgreSQL — purely a memory/key-count hygiene bound
      # so cold entries eventually fall out of Redis on their own. See ADR
      # 0016's hypothesis section for the full staleness-tolerance
      # reasoning.
      ttl: PT5M
    variant-annotation:
      # 30 minutes, longer than work-items' 5 (services#24, ADR 0018):
      # unlike work-items, this cache has a real invalidation-on-write
      # story (services#26) as its correctness mechanism, so TTL here is
      # purely a memory/key-count hygiene bound with more headroom to
      # pick a value from -- ClinVar itself only republishes weekly, so
      # even a much longer TTL would still be "correct", this is just a
      # reasonable default, not a tuned number.
      ttl: PT30M

# In-cluster Kubernetes Service DNS default (ADR 0019, same pattern as
# ADR 0010's api.base-url property, formerly in gateway's application.yml
# before gateway was removed under ADR 0021) -- overridden at
# deploy time by CLINVAR_SERVICE_URL. clinvar-service owns its own
# namespace (`clinvar`), single consumer of its own dedicated Postgres
# instance and PVC -- exactly the shape ADR 0019 exists to establish
# after ADR 0018's cross-namespace PVC/Secret bugs.
clinvar-service:
  base-url: ${CLINVAR_SERVICE_URL:http://clinvar-service.clinvar.svc.cluster.local}
